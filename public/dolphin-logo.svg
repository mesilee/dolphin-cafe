<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1D4ED8;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#2563EB;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="dolphinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <clipPath id="circleClip">
      <circle cx="150" cy="130" r="110"/>
    </clipPath>
  </defs>

  <!-- Outer ring -->
  <circle cx="150" cy="130" r="120" fill="none" stroke="#2563EB" stroke-width="2" opacity="0.3"/>
  
  <!-- Main circle -->
  <circle cx="150" cy="130" r="110" fill="url(#bgGrad)"/>
  
  <!-- Inner subtle ring -->
  <circle cx="150" cy="130" r="100" fill="none" stroke="#FFFFFF" stroke-width="0.5" opacity="0.15"/>

  <!-- Curved wave line -->
  <path d="M40 180 Q90 140, 150 160 Q210 180, 260 140" stroke="#FFFFFF" stroke-width="1.5" fill="none" opacity="0.12"/>

  <!-- Dolphin body - elegant curve -->
  <g filter="url(#glow)">
    <!-- Main body -->
    <path d="M115 70 
             C90 55, 55 65, 50 95 
             C45 125, 60 155, 90 165 
             C100 168, 108 162, 105 152 
             C102 142, 85 130, 70 118 
             C55 106, 50 88, 60 78 
             C68 70, 85 65, 105 72 
             C110 74, 115 70, 115 70Z" 
          fill="url(#dolphinGrad)" opacity="0.95"/>
    
    <!-- Head/nose -->
    <path d="M115 70 
             C135 52, 160 40, 180 48 
             C192 54, 188 68, 178 74 
             C170 78, 160 75, 158 68 
             C160 58, 170 52, 178 55 
             C172 46, 155 42, 140 50 
             C128 58, 118 65, 115 70Z" 
          fill="url(#dolphinGrad)"/>
    
    <!-- Body curve/tail -->
    <path d="M178 74 
             C195 85, 205 105, 195 130 
             C185 150, 160 168, 135 178 
             C118 185, 108 188, 100 182 
             C92 176, 90 165, 98 160 
             C108 155, 125 162, 140 168 
             C162 175, 180 160, 188 140 
             C198 118, 195 95, 185 82 
             C180 76, 180 72, 178 74Z" 
          fill="url(#dolphinGrad)"/>
    
    <!-- Dorsal fin -->
    <path d="M178 74 
             C182 60, 192 48, 200 52 
             C205 55, 198 65, 190 72 
             C186 75, 182 76, 178 74Z" 
          fill="url(#dolphinGrad)" opacity="0.9"/>
    
    <!-- Tail flukes -->
    <path d="M135 178 
             C128 190, 115 198, 105 195 
             C95 192, 100 182, 110 178 
             C118 175, 128 176, 135 178Z" 
          fill="url(#dolphinGrad)" opacity="0.9"/>
    <path d="M135 178 
             C142 190, 155 198, 165 195 
             C175 192, 170 182, 160 178 
             C152 175, 142 176, 135 178Z" 
          fill="url(#dolphinGrad)" opacity="0.9"/>
    
    <!-- Flipper -->
    <path d="M100 152 
             C88 160, 72 170, 65 168 
             C58 166, 62 158, 72 152 
             C80 148, 92 148, 100 152Z" 
          fill="url(#dolphinGrad)" opacity="0.85"/>
    
    <!-- Eye -->
    <circle cx="138" cy="62" r="4.5" fill="#1E3A8A"/>
    <circle cx="139" cy="61" r="1.8" fill="#FFFFFF"/>
    
    <!-- Smile line -->
    <path d="M130 68 Q140 74, 152 70" stroke="#1E3A8A" stroke-width="1" fill="none" opacity="0.3"/>
  </g>

  <!-- Text -->
  <text x="150" y="268" text-anchor="middle" fill="#FFFFFF" font-family="'Georgia', 'Times New Roman', serif" font-size="24" font-weight="700" letter-spacing="0.15em">DOLPHIN CAFE</text>
  <line x1="90" y1="278" x2="210" y2="278" stroke="#3B82F6" stroke-width="1" opacity="0.4"/>
</svg>